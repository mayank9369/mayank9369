name: 🐍 Generate Contribution Snake

on:
  schedule:
    # Runs every 12 hours so the snake stays fresh
    - cron: "0 */12 * * *"
  # Lets you trigger it manually from the Actions tab
  workflow_dispatch:
  # Re-generates on every push to your default branch
  push:
    branches:
      - main # ⚠️ change to "master" if that's your default branch

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🌙 Generate snake (dark palette)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: mayank9369
          outputs: |
            dist/snake.svg?palette=github-dark

      - name: ☀️ Generate snake (light palette)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: mayank9369
          outputs: |
            dist/snake-light.svg

      - name: 🚀 Publish to `output` branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
